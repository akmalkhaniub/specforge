# GCP Cloud Build pipeline: build + push the API image, deploy it to Cloud Run,
# build the web app, and deploy it to Firebase Hosting.
#
# Secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY, DATABASE_URL, REDIS_URL) come from
# Secret Manager — never inline them here. Set non-secret config via --set-env-vars.
steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/specforge-api:$COMMIT_SHA
      - -f
      - apps/api/Dockerfile
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/specforge-api:$COMMIT_SHA]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - specforge-api
      - --image=gcr.io/$PROJECT_ID/specforge-api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=NODE_ENV=production,CORS_ORIGIN=${_WEB_ORIGIN},MINIO_ENDPOINT=${_MINIO_ENDPOINT},EMBEDDINGS_ENABLED=${_EMBEDDINGS_ENABLED}
      - --set-secrets=DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENAI_API_KEY=openai-api-key:latest,MINIO_ACCESS_KEY=minio-access-key:latest,MINIO_SECRET_KEY=minio-secret-key:latest

  - id: build-web
    name: node:20-slim
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm --filter @specforge/shared build
        pnpm --filter web build
    env:
      - VITE_API_URL=${_API_URL}

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: firebase
    args: [deploy, --only, hosting, --project, $PROJECT_ID, --non-interactive]

images:
  - gcr.io/$PROJECT_ID/specforge-api:$COMMIT_SHA

substitutions:
  _REGION: me-central2
  _API_URL: https://specforge-api-xxxx-uc.a.run.app
  _WEB_ORIGIN: https://specforge.web.app
  _MINIO_ENDPOINT: storage.googleapis.com
  _EMBEDDINGS_ENABLED: "false"

options:
  logging: CLOUD_LOGGING_ONLY
