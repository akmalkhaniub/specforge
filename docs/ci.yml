# SpecForge CI workflow.
#
# To enable: move this file to .github/workflows/ci.yml and push. Pushing a
# workflow file requires a token with the `workflow` scope — either:
#   - add it via the GitHub web UI (Actions tab → new workflow), or
#   - run `gh auth refresh -s workflow` then move + push the file.
#
# Add repo secret ANTHROPIC_API_KEY (Settings → Secrets → Actions) so the eval
# job can run on ai/** changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @specforge/shared build
      - run: pnpm -r typecheck

  eval:
    name: Extraction eval (gates ai/** changes)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect ai/** changes
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^apps/api/src/ai/'; then
            echo "ai_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.ai_changed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.ai_changed == 'true'
        with:
          node-version: 20
          cache: pnpm
      - name: Run eval
        if: steps.changes.outputs.ai_changed == 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @specforge/shared build
          pnpm --filter api eval
